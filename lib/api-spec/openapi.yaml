openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GDPR Repo Intelligence Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scans
    description: Repository GDPR scan operations
  - name: documents
    description: DPIA / policy document operations
  - name: openai
    description: OpenAI AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Scans ─────────────────────────────────────────────────────────────────
  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List all scans
      responses:
        "200":
          description: All scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
    post:
      operationId: createScan
      tags: [scans]
      summary: Trigger a new GDPR scan for a GitHub repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "201":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /scans/stats:
    get:
      operationId: getScanStats
      tags: [scans]
      summary: Aggregate stats across all scans
      responses:
        "200":
          description: Aggregate scan statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStats"

  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get a scan with all findings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan with findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteScan
      tags: [scans]
      summary: Delete a scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Documents ──────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all uploaded documents
      responses:
        "200":
          description: All documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload a DPIA form or policy document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document with its extracted text
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── OpenAI Chat ────────────────────────────────────────────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a message and receive a streaming AI response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── Scans ────────────────────────────────────────────────────────────────
    ScanInput:
      type: object
      required: [githubUrl]
      properties:
        githubUrl:
          type: string
          description: Full GitHub repository URL

    Scan:
      type: object
      required: [id, githubUrl, repoName, status, createdAt]
      properties:
        id:
          type: integer
        githubUrl:
          type: string
        repoName:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed]
        gdprScore:
          type: ["integer", "null"]
        riskLevel:
          type: ["string", "null"]
        totalFindings:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time

    ScanDetail:
      type: object
      required: [id, githubUrl, repoName, status, createdAt, findings, dependencies]
      properties:
        id:
          type: integer
        githubUrl:
          type: string
        repoName:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed]
        gdprScore:
          type: ["integer", "null"]
        riskLevel:
          type: ["string", "null"]
        totalFindings:
          type: ["integer", "null"]
        breakdown:
          type: ["object", "null"]
          additionalProperties:
            type: number
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyResult"

    Finding:
      type: object
      required: [type, category, file, evidence, riskScore]
      properties:
        type:
          type: string
        category:
          type: string
        file:
          type: string
        line:
          type: ["integer", "null"]
        evidence:
          type: string
        riskScore:
          type: integer

    DependencyResult:
      type: object
      required: [name, category, gdprRelevance]
      properties:
        name:
          type: string
        category:
          type: string
        gdprRelevance:
          type: integer

    ScanStats:
      type: object
      required: [totalScans, avgScore, highRiskCount, mediumRiskCount, lowRiskCount, recentScans]
      properties:
        totalScans:
          type: integer
        avgScore:
          type: number
        highRiskCount:
          type: integer
        mediumRiskCount:
          type: integer
        lowRiskCount:
          type: integer
        recentScans:
          type: array
          items:
            $ref: "#/components/schemas/Scan"

    # ── Documents ─────────────────────────────────────────────────────────────
    DocumentUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        name:
          type: string
        type:
          type: string
          enum: [dpia, policy, other]

    Document:
      type: object
      required: [id, name, type, mimeType, sizeBytes, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time

    DocumentDetail:
      type: object
      required: [id, name, type, mimeType, sizeBytes, extractedText, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        extractedText:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── OpenAI ────────────────────────────────────────────────────────────────
    OpenaiConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time

    OpenaiConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string

    OpenaiMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    OpenaiMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
        scanId:
          type: ["integer", "null"]
          description: Optional scan ID to include as context
        documentIds:
          type: array
          items:
            type: integer
          description: Optional document IDs to include as context

    OpenaiConversationWithMessages:
      type: object
      required: [id, title, createdAt, messages]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"

    OpenaiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
